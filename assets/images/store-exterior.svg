<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#grad)" />
  <rect width="1200" height="700" fill="url(#grid)" />
  <circle cx="960.0" cy="175.0" r="140.0" fill="#D97706" fill-opacity="0.12" filter="blur(40px)"/>
  <g transform="translate(600.0, 350.0)">
    <rect x="-140" y="-70" width="280" height="140" rx="16" fill="#000000" fill-opacity="0.25" stroke="#D97706" stroke-opacity="0.3" stroke-width="1"/>
    <text text-anchor="middle" y="-12" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="1">Storefront Exterior</text>
    <text text-anchor="middle" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="500" fill="#D97706" letter-spacing="2">LANDSCAPE ENTRANCE & DISPLAY</text>
    <text text-anchor="middle" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#A8A29E">[ Replace with client photo in assets/images/ ]</text>
  </g>
</svg>