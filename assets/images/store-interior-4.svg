    <text text-anchor="middle" y="-12" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="1">Shoe Care & Accessories Bar</text>
    <text text-anchor="middle" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="500" fill="#F59E0B" letter-spacing="2">LACES, POLISHES & RESOLING COUNTER</text>
    <text text-anchor="middle" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#A8A29E">[ Replace with client photo in assets/images/ ]</text>
